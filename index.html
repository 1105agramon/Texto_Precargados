<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Información</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="header-titles">
                <h1>Gestor de Respuestas y Trámites</h1>
                <div class="user-time-container" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <p class="subtitle" style="margin: 0;">Juan Alberto Granados Ramírez</p>
                    <input type="time" id="horaInput" class="time-field" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <button id="btnGuardarHora" class="theme-btn" style="padding: 5px 10px; font-size: 12px;" title="Guardar hora en Sheets">💾</button>
                </div>
                <button id="themeToggle" class="theme-btn"> <span class="icon">🌙</span> </button>
            </div>
            
            <!-- Contenedor principal agrupado -->
            <div class="controls-container">
                
                <!-- 1. Caja del buscador -->
                <div class="search-box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Buscar por tema, subtema o categoría">
                    <button id="clearSearch" class="clear-btn" title="Limpiar búsqueda">&times;</button>
                </div>

                <!-- 2. Caja del Folio -->
                <div class="folio-box">
                    <input type="text" id="folioInput" placeholder="Folio" class="folio-field">
                    <button id="btnCopiarFolio" class="copy-folio-btn">Copiar Folio</button>
                </div>

                <!-- 3. NUEVO: Caja de Medios de Contacto -->
                <div class="contact-box">
                    <input type="text" id="correoInput" placeholder="📧 Correo electrónico" class="contact-field">
                    <input type="text" id="telefonoInput" placeholder="📱 Teléfono" class="contact-field">
                    <button id="btnCopiarContacto" class="copy-contact-btn">Copiar Mensaje</button>
                </div>
            </div>

            <!-- Botón flotante -->
            <button id="btnInicio" class="btn-inicio" title="Volver al inicio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
            </button>
        </header>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Tema</th>
                        <th>Subtema</th>
                        <th>Categoría</th>
                        <th>Texto de Respuesta</th>
                        <th>Hashtag</th>
                        <th class="center-col">Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="loading">
                            <div class="loader"></div>
                            Cargando base de datos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
