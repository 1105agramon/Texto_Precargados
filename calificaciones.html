<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones de Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<script>
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light-mode');
</script>
<body class="">
    <div class="container" style="max-width: 1000px; height: auto; min-height: 90vh;">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
            <div class="header-titles">
                <h1>⭐ Calificaciones de Chat</h1>
                <p class="subtitle">Registros agrupados por corte con promedio automático</p>
            </div>
            
            <div>
                <a href="index.html" class="theme-btn" style="text-decoration: none; padding: 10px 20px; font-weight: 600;">
                    🏠 Volver al Inicio
                </a>
            </div>
        </header>

        <!-- Formulario CRUD para Agregar Calificación -->
        <div style="background: var(--surface-color); border-radius: 8px; border: 1px solid var(--border-color); padding: 15px; margin-bottom: 20px;">
            <div style="margin-bottom: 10px; font-weight: 600; color: var(--primary-color);">📝 Agregar Nuevo Registro</div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <input type="text" id="nuevoCorte" placeholder="Ej: Tabla_1, Octubre..." class="contact-field" style="width: 150px;" title="Nombre del grupo/corte para promediar">
                <input type="number" id="nuevaSemana" placeholder="Semana (Ej: 1)" class="contact-field" style="width: 120px;">
                <input type="text" id="nuevaFecha" placeholder="Fecha (Ej: 1 al 5 Jun)" class="contact-field" style="flex: 1; min-width: 150px;">
                <input type="number" id="nuevoChatCal" placeholder="Chat Calif (Ej: 88)" class="contact-field" style="width: 150px;">
                <input type="number" step="0.01" id="nuevaCalGen" placeholder="Calif Gral (Ej: 9.54)" class="contact-field" style="width: 150px;">
                <input type="text" id="nuevaPosicion" placeholder="Posición (Ej: 2°)" class="contact-field" style="width: 120px;">
                <button id="btnAgregarCalificacion" class="copy-btn" style="background-color: var(--primary-color); color: var(--bg-color); padding: 12px 15px;">➕ Agregar</button>
            </div>
        </div>

        <!-- Contenedor donde se crearán las tablas agrupadas -->
        <div id="tablasContainer" style="display: flex; flex-direction: column; gap: 30px;">
            <div class="loading" style="text-align: center; padding: 50px;">
                <div class="loader"></div>
                Cargando calificaciones...
            </div>
        </div>
    </div>

    <script type="module" src="calificaciones.js"></script>
</body>
</html>
